{% extends "ordering/base.html" %}
{% block title %}Track order{% endblock %}
{% block content %}
<div class="narrow">
  <h1 class="page-title">Track your order</h1>
  <p class="text-muted">Enter the Order ID you received at checkout.</p>
  <form method="post" class="summary">
    {% csrf_token %}
    <label class="form-label" for="{{ form.order_id.id_for_label }}">{{ form.order_id.label }}</label>
    {{ form.order_id }}
    {% for e in form.order_id.errors %}<div class="text-danger small mt-1">{{ e }}</div>{% endfor %}
    <button class="btn btn-pine mt-3" type="submit">Track</button>
  </form>
</div>
{% endblock %}
