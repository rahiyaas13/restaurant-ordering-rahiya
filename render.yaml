services:
  - type: web
    name: pluvia-restaurant
    runtime: python
    rootDir: .
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python manage.py seed_menu && python manage.py fetch_images && python create_superuser.py"
    startCommand: "python manage.py migrate && python manage.py seed_menu && python manage.py fetch_images && python create_superuser.py && gunicorn restaurant_project.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: WEB_CONCURRENCY
        value: 2
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
